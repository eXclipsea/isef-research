use_default_settings: true

general:
  debug: false
  instance_name: "ResearchOS Search"

server:
  port: 8080
  bind_address: "127.0.0.1"
  secret_key: "researchos-isef-local-key-change-me"
  base_url: "http://localhost:8080/"
  image_proxy: false

ui:
  static_use_hash: false
  default_locale: "en"
  default_theme: simple
  infinite_scroll: true
  results_on_new_tab: false
  theme_args:
    simple_style: dark

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

# Enable key engines for ISEF research
engines:
  - name: google
    engine: google
    shortcut: g
    use_mobile_ui: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: bing
    engine: bing
    shortcut: b

  - name: arxiv
    engine: arxiv
    shortcut: arxiv
    categories: science
    timeout: 10.0

  - name: pubmed
    engine: pubmed
    shortcut: pub
    categories: science
    timeout: 10.0

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: ss
    categories: science
    timeout: 10.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: general

  - name: google scholar
    engine: google_scholar
    shortcut: gs
    categories: science
    timeout: 10.0

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
